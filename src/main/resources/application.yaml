spring:
  application:
    name: Yachani
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: ${AI_CHAT_PROVIDER:none}
    openai:
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:gpt-5.4-mini}
        reasoning-effort: none
        max-completion-tokens: 600
        timeout: 25s
        max-retries: 0
      audio:
        transcription:
          model: ${AI_TRANSCRIPTION_MODEL:gpt-transcribe}
          response-format: json
          timeout: 45s
          max-retries: 0

  # El WebSocket (chat en tiempo real) registra sus propios ejecutores de tareas y, sin
  # esto, Spring Boot deja de crear "applicationTaskExecutor", que usan los correos de
  # notificaciones (NotificacionCorreoListener).
  task:
    execution:
      mode: force

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true
    test-connection: false


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

recursos:
  max-archivos: 5
  max-bytes-archivo: 10485760
  max-temas: 30
  segundos-descarga: 120
  extensiones: pdf,docx,pptx,xlsx,png,jpg,jpeg

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

yachani:
  recordatorio:
    minutos-antes: 60

app:
  contacto:
    destinatario: ${CONTACT_MAIL_TO:yachani.soporte@gmail.com}
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:4200}"
  notificaciones:
    correo:
      destinatario-prueba: ${NOTIFICACIONES_CORREO_DESTINATARIO_PRUEBA:}
